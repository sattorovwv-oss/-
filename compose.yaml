name: tuman-kargo

services:
  app:
    build: .
    restart: unless-stopped
    env_file: ${TUMAN_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      WEB_ONLY: "0"
      HOST: 0.0.0.0
      PORT: "8000"
      DB_PATH: /app/var/tuman.db
      # Only Caddy reaches this unexposed service; it sanitizes forwarded headers.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - tuman_data:/app/var
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 25s
    logging:
      options:
        max-size: 10m
        max-file: "3"
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env to your actual hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  tuman_data:
  caddy_data:
  caddy_config:
